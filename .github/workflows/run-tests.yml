name: Run Tests

on:
  workflow_call:

jobs:
  cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://ghcr.io/php-cs-fixer/php-cs-fixer:3-php8.2
        with:
          args: check
  doc-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
        env:
          update: true

      # Cloudflare moves its documentation, and a docblock @link that 404s is
      # invisible until somebody clicks it. Checked against the live site, so
      # this catches their moves as well as ours.
      - name: Check documentation links resolve
        run: php bin/check-doc-links.php --quiet

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Analysed on the lowest supported PHP version, so nothing newer than
      # the declared floor slips into src/.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
        env:
          update: true

      - name: Install PHP Dependencies
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --no-interaction --no-progress

      - name: Execute PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # Empty unless the repository has the secret, which the upload step checks.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: pcov
        env:
          update: true

      - name: Install PHP Dependencies
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --no-interaction --no-progress

      - name: Execute PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      # The gate lives in the repository, so the same threshold applies locally
      # and in CI whether or not Codecov is attached.
      - name: Enforce coverage threshold
        run: php bin/check-coverage.php clover.xml

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./clover.xml
          fail_ci_if_error: true

  tests:
    name: PHP ${{ matrix.php }}; Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          # Laravel 13 requires PHP >= 8.3
          - php: '8.2'
            laravel: '13'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          # Coverage is measured once, in the dedicated job above.
          coverage: none
        env:
          update: true

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Select Laravel ${{ matrix.laravel }}
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework:^${{ matrix.laravel }}" --no-update --no-interaction

      - name: Install PHP Dependencies
        uses: nick-invision/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --no-interaction --no-progress

      - name: Execute PHPUnit
        run: vendor/bin/phpunit
